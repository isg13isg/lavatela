name: Reseñas de Google
on:
  schedule:
    - cron: "15 5 * * *"   # cada día a las 6:15/7:15 (hora de Madrid)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer nota y nº de opiniones
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PLACE_ID: ${{ vars.PLACE_ID }}
        run: python actualizar_resenas.py
      - name: Publicar si ha cambiado
        run: |
          git config user.name "lavatela-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Reseñas de Google: actualización diaria" && git push)
